<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untuk Kamu, Sayangku</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blush:#fbe9e7;--pink:#f4c6c9;--rose:#c9808a;--gold:#b98a6a;--cream:#fffaf5;--ink:#5b3a3f;--soft:#8a6a6e}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Quicksand',sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--cream),var(--blush) 60%,var(--cream));line-height:1.7;overflow-x:hidden}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:600}
.script{font-family:'Great Vibes',cursive;color:var(--rose)}
section{padding:80px 20px;max-width:1000px;margin:0 auto;text-align:center}
h2{font-size:clamp(2rem,5vw,2.8rem);margin-bottom:8px}
.sub{color:var(--soft);margin-bottom:36px}

/* HERO */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:40px}
.portrait{width:190px;height:190px;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 0 0 2px var(--pink),0 18px 40px rgba(201,128,138,.35);animation:pop 1.2s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#hero .script{font-size:clamp(2.2rem,7vw,3.4rem);margin-top:22px}
#hero h1{font-size:clamp(2.4rem,8vw,4.6rem);line-height:1.1;margin:4px 0 12px}
#hero p.lead{max-width:460px;color:var(--soft);margin-bottom:28px}
.btn{font:inherit;font-weight:600;cursor:pointer;border:none;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#d9929b,#c9808a);color:#fff;box-shadow:0 8px 20px rgba(201,128,138,.4);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(201,128,138,.5)}
.btn.ghost{background:#fff;color:var(--rose);border:1.5px solid var(--pink);box-shadow:none}
.hint{margin-top:34px;color:var(--soft);font-size:.85rem;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* GALERI */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px}
figure{background:#fff;padding:12px 12px 16px;border-radius:6px;box-shadow:0 10px 28px rgba(91,58,63,.12);cursor:zoom-in;transition:transform .35s}
figure:nth-child(odd){transform:rotate(-1.8deg)}figure:nth-child(even){transform:rotate(1.8deg)}
figure:hover{transform:rotate(0) scale(1.03)}
figure img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:3px}
figcaption{margin-top:12px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--soft)}
#lightbox{position:fixed;inset:0;background:rgba(60,35,40,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;padding:20px;cursor:zoom-out}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:78vh;border-radius:8px;border:6px solid #fff}
#lightbox p{color:#fff;margin-top:14px;font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-style:italic}

/* INTERAKTIF */
#love{background:rgba(255,255,255,.55);border-radius:32px;margin-bottom:40px}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.ask{display:none;margin-top:30px}
.ask.show{display:block}
.ask h3{font-family:'Cormorant Garamond',serif;font-size:1.9rem;margin-bottom:20px}
.arena{position:relative;height:130px;max-width:420px;margin:0 auto}
.arena .btn{position:absolute;top:30px}
#yes{left:6%}
#no{right:6%;background:#fff;color:var(--soft);border:1.5px solid var(--pink);box-shadow:none;transition:left .25s,top .25s}
.answer{display:none;font-size:1.3rem}
.answer .script{font-size:2.6rem}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(91,58,63,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--cream);border-radius:28px;padding:38px 28px 28px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .5s both}
.modal p{font-family:'Cormorant Garamond',serif;font-size:1.6rem;line-height:1.35;margin-bottom:24px;min-height:120px;display:flex;align-items:center;justify-content:center}
footer{padding:50px 20px 90px;text-align:center;color:var(--soft)}
footer .script{font-size:2rem}

#music{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:none;background:#fff;color:var(--rose);font-size:1.3rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:30}
#music.on{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.heart{position:fixed;bottom:-30px;pointer-events:none;z-index:5;opacity:.7;animation:float linear forwards}
@keyframes float{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>

<!-- ================================================= -->

<section id="hero">
  <img id="heroImg" class="portrait" alt="Foto kamu">
  <p class="script" id="hi"></p>
  <h1>Kita, sejauh ini.</h1>
  <p class="lead" id="lead"></p>
  <button class="btn" onclick="document.getElementById('kenangan').scrollIntoView()">Lihat kenangan kita</button>
  <p class="hint">gulir ke bawah ↓</p>
</section>

<section id="kenangan" class="reveal">
  <h2>Kenangan Kita</h2>
  <p class="sub">Ketuk foto untuk memperbesar</p>
  <div class="gallery" id="gallery"></div>
</section>

<section id="love" class="reveal">
  <h2>Ada yang ingin kutanyakan…</h2>
  <p class="sub">Dua tombol kecil, satu isi hati.</p>
  <div class="row">
    <button class="btn" id="reasonBtn">Alasan kenapa aku sayang kamu</button>
    <button class="btn ghost" id="askBtn">Satu pertanyaan penting</button>
  </div>
  <div class="ask" id="ask">
    <h3>Mau jadi pacar aku selamanya?</h3>
    <div class="arena" id="arena">
      <button class="btn" id="yes">Mau 💗</button>
      <button class="btn" id="no">Tidak</button>
    </div>
  </div>
  <div class="answer" id="answer"><p class="script">Yeay! Aku sayang kamu.</p><p>Terima kasih sudah memilih aku, lagi dan lagi. 🤍</p></div>
</section>

<footer><p class="script">Dari <span id="from"></span>, dengan seluruh sayang</p></footer>

<div class="overlay" id="modal" role="dialog" aria-modal="true">
  <div class="modal"><p id="reasonText"></p>
    <div class="row"><button class="btn" id="nextReason">Satu lagi 💌</button><button class="btn ghost" id="closeModal">Tutup</button></div>
  </div>
</div>
<div id="lightbox"><img alt=""><p></p></div>
<button id="music" title="Putar musik" aria-label="Putar musik" hidden>♪</button>
<audio id="bgm" loop></audio>

<script>
const $ = id => document.getElementById(id);
$('hi').textContent = `Hai, ${CONFIG.nama}`;
$('lead').textContent = CONFIG.pesanHero;
$('from').textContent = CONFIG.namaKamu;
$('heroImg').src = CONFIG.galeri[0].src;

/* Galeri + lightbox */
const lb = $('lightbox');
$('gallery').innerHTML = CONFIG.galeri.map((g,i)=>`<figure tabindex="0" data-i="${i}"><img src="${g.src}" alt="${g.caption}" loading="lazy"><figcaption>${g.caption}</figcaption></figure>`).join('');
document.querySelectorAll('figure').forEach(f=>{
  const open=()=>{const g=CONFIG.galeri[f.dataset.i];lb.querySelector('img').src=g.src;lb.querySelector('p').textContent=g.caption;lb.classList.add('show')};
  f.onclick=open; f.onkeydown=e=>{if(e.key==='Enter')open()};
});
lb.onclick=()=>lb.classList.remove('show');

/* Alasan acak */
let last=-1;
function showReason(){
  let i; do{i=Math.floor(Math.random()*CONFIG.alasan.length)}while(i===last&&CONFIG.alasan.length>1);
  last=i; $('reasonText').textContent=CONFIG.alasan[i]; $('modal').classList.add('show'); hearts(8);
}
$('reasonBtn').onclick=showReason; $('nextReason').onclick=showReason;
$('closeModal').onclick=()=>$('modal').classList.remove('show');
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};

/* Pertanyaan + tombol "Tidak" yang kabur */
$('askBtn').onclick=()=>{$('ask').classList.add('show');$('ask').scrollIntoView({block:'center'})};
const no=$('no'), arena=$('arena'), labels=['Tidak','Yakin?','Coba pikir lagi 🥺','Jangan dong…','Masa sih?','Kok kabur sih 😭'];
let tries=0, scale=1;
function dodge(e){
  if(e)e.preventDefault();
  tries++; no.textContent=labels[Math.min(tries,labels.length-1)];
  const a=arena.getBoundingClientRect(), b=no.getBoundingClientRect();
  no.style.right='auto';
  no.style.left=Math.random()*(a.width-b.width)+'px';
  no.style.top=Math.random()*(a.height-b.height)+'px';
  scale=Math.min(scale+.12,1.7); $('yes').style.transform=`scale(${scale})`;
}
no.addEventListener('mouseenter',dodge); no.addEventListener('touchstart',dodge,{passive:false}); no.addEventListener('click',dodge);
$('yes').onclick=()=>{$('ask').classList.remove('show');$('answer').style.display='block';hearts(40)};

/* Hati melayang */
function hearts(n){
  for(let i=0;i<n;i++){
    const h=document.createElement('span'); h.className='heart';
    h.textContent=['💗','🤍','💕','🌸'][i%4];
    h.style.left=Math.random()*100+'vw'; h.style.fontSize=14+Math.random()*22+'px';
    h.style.animationDuration=4+Math.random()*4+'s'; h.style.animationDelay=Math.random()*1.2+'s';
    document.body.appendChild(h); setTimeout(()=>h.remove(),9500);
  }
}
setTimeout(()=>hearts(10),900);

/* Muncul saat digulir */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* Musik latar */
if(CONFIG.musik){
  const a=$('bgm'), b=$('music'); a.src=CONFIG.musik; b.hidden=false;
  b.onclick=()=>{ if(a.paused){a.play();b.classList.add('on')}else{a.pause();b.classList.remove('on')} };
}
</script>
</body>
</html>
